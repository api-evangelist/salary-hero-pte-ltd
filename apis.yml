name: SALARY HERO PTE. LTD
description: >-
  Salary Hero is a Singapore-headquartered financial wellness and earned wage
  access (EWA) platform offered to employees through their employers. Its
  products include Salary on Demand (accessing earned wages before payday),
  budgeting and spending-tracking tools, savings accounts (a partnership with
  Dime offering 3% interest), and financial-literacy education covering debt
  management and investing. The service is delivered via iOS and Android apps
  and is provisioned by employers, integrating with existing payroll and HR
  systems. Salary Hero is a portfolio company of 500 Global. This profile was
  enriched by the API Evangelist pipeline; no public developer API, portal, or
  documentation surface was found.
